<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>What keeps it moving?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../harness/lab.css">
<script type="module">
import { mountLab } from "../harness/lab.js";
import { stepWithFriction } from "../components/motion.mjs";

/* Topic 3 · motion-implies-force.
   "Nothing happens" is undramatic, so the drama comes from the CONTRAST: the
   puck with a steady push does not hold its speed, it runs away. Both leave
   ticker tape — a dot every fixed interval — so constant speed and
   acceleration are legible at a glance, the way a real lab tape is. */

const G = 9.81;
const SPAN = 26;               // metres across the view
const TICK = 0.25;             // seconds between tape dots
const MASS = 0.5;              // kg

let lab;
lab = mountLab({
  question: "Two identical pucks, same speed. One has a steady forward push, one has nothing. What happens?",
  note: "Ticker tape: a dot every quarter second. Even spacing means steady speed.",
  options: [
    { id: "needs",  label: "The pushed one keeps its speed; the other slows and stops" },
    { id: "runaway",label: "The pushed one keeps speeding up; the other holds its speed forever" },
    { id: "same",   label: "Both carry on at the same steady speed" },
    { id: "both",   label: "Both slow down — the pushed one just takes longer" },
  ],
  correct: "runaway",
  explain:
    "A force does not maintain speed, it CHANGES it — so a steady push means steady " +
    "acceleration, not steady motion. The unpushed puck needs nothing at all to keep going. " +
    "Turn the friction up and it does slow down, which is the real answer to why everyday " +
    "things stop: something is quietly pushing back, not because motion runs out.",
  params: [
    { key: "push",     label: "push on B", min: 0,   max: 2,   step: 0.1,  value: 0.6, unit: " N" },
    { key: "friction", label: "friction",  min: 0,   max: 0.3, step: 0.01, value: 0,   unit: "" },
    { key: "u",        label: "start",     min: 2,   max: 8,   step: 0.5,  value: 4,   unit: " m/s" },
  ],

  setup(_, p) {
    const lane = () => ({ x: 1, v: p.u, tape: [1] });
    return { a: lane(), b: lane(), t: 0, nextTick: TICK, done: false };
  },

  step(s, dt, p) {
    if (s.done) return;
    // Static friction matters here: without it a puck whose push is smaller
    // than friction stops, loses its friction at v=0, gets restarted by the
    // push, and creeps forward looking like steady motion.
    for (const [lane, appliedForce] of [[s.a, 0], [s.b, p.push]]) {
      stepWithFriction(lane, { appliedForce, mass: MASS, mu: p.friction, g: G }, dt);
    }
    s.t += dt;
    if (s.t >= s.nextTick) {
      s.nextTick += TICK;
      s.a.tape.push(s.a.x);
      s.b.tape.push(s.b.x);
    }
    // Reveal when the story has told itself: B off the end, or both at rest.
    const settled = s.a.v === 0 && s.b.v === 0 && s.t > 1;
    if (s.b.x > SPAN - 1.5 || s.a.x > SPAN - 1.5 || settled) { s.done = true; lab.reveal(); }
  },

  draw(ctx, s, p, view) {
    const scale = view.w / SPAN;
    const X = (x) => x * scale;

    ctx.fillStyle = "#1B1815";
    ctx.fillRect(0, 0, view.w, view.h);

    const lanes = [
      { st: s.a, y: view.h * 0.36, name: "A · nothing pushing it", tint: "#4FB286" },
      { st: s.b, y: view.h * 0.70, name: "B · steady 0.6 N push",  tint: "#E8703A" },
    ];
    lanes[1].name = `B · steady ${p.push.toFixed(1)} N push`;

    for (const L of lanes) {
      ctx.strokeStyle = "#332E28"; ctx.lineWidth = 1;
      seg(ctx, 0, L.y + 22, view.w, L.y + 22);

      // ticker tape — a dot every TICK seconds
      for (const x of L.st.tape) {
        ctx.fillStyle = L.tint;
        ctx.globalAlpha = 0.55;
        ctx.beginPath(); ctx.arc(X(x), L.y + 22, 3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // the puck
      ctx.fillStyle = L.tint;
      roundRect(ctx, X(L.st.x) - 13, L.y - 9, 26, 26, 5);

      label(ctx, L.name, 14, L.y - 22, L.tint);
      label(ctx, `${L.st.v.toFixed(2)} m/s`, view.w - 96, L.y - 22, "#A79E92");

      if (L.st === s.b && p.push > 0) {
        // from behind the puck, pointing FORWARD — the arrowhead is the second point
        arrow(ctx, X(L.st.x) - 52, L.y + 4, X(L.st.x) - 18, L.y + 4, "#E8703A");
      }
    }

    label(ctx, p.friction === 0 ? "friction: none — a perfectly slippery floor"
                                : `friction: ${p.friction.toFixed(2)}`,
          14, view.h - 14, p.friction === 0 ? "#6E665C" : "#D65442");
    label(ctx, `t = ${s.t.toFixed(2)} s`, view.w - 96, view.h - 14, "#6E665C");
  },
});

function seg(ctx, x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
  ctx.lineTo(x + w, y + h - r); ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  ctx.lineTo(x + r, y + h); ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, Math.PI, -Math.PI / 2);
  ctx.fill();
}
function arrow(ctx, x1, y1, x2, y2, colour) {
  ctx.strokeStyle = colour; ctx.fillStyle = colour; ctx.lineWidth = 3;
  seg(ctx, x1, y1, x2, y2);
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 9 * Math.cos(a - 0.45), y2 - 9 * Math.sin(a - 0.45));
  ctx.lineTo(x2 - 9 * Math.cos(a + 0.45), y2 - 9 * Math.sin(a + 0.45));
  ctx.fill();
}
function label(ctx, text, x, y, colour) {
  ctx.fillStyle = colour;
  ctx.font = '12px "Spline Sans Mono", ui-monospace, monospace';
  ctx.fillText(text, x, y);
}
</script>

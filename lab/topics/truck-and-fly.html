<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Does the truck push harder than the fly?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../harness/lab.css">
<script type="module">
import { mountLab } from "../harness/lab.js";
import { accelerationFrom, stepContact } from "../components/collision.mjs";

/* Topic 2 · bigger-pushes-harder.
   Contact is a stiff spring, not an instant impulse, precisely so the force
   can be SEEN acting for a span of time — the same size on both bodies. */

const SLOW = 0.002;            // sim seconds per real second: contact lasts ~1s on screen
const K = 500;                 // contact stiffness, N/m
const LEFT = -0.12, RIGHT = 0.28;
const FLY_START = 0.05;
const REVEAL_AT = 0.15;

let lab;
lab = mountLab({
  question: "A truck hits a fly. Which one pushes harder on the other?",
  note: "Slowed about 500×, and zoomed right in on the moment of contact.",
  options: [
    { id: "truck", label: "The truck pushes much harder on the fly" },
    { id: "equal", label: "They push on each other exactly as hard" },
    { id: "fly",   label: "The fly pushes harder — that is why it splatters" },
    { id: "speed", label: "It depends how fast the truck is going" },
  ],
  correct: "equal",
  explain:
    "Equal forces, every time — change the masses or the speed and they stay equal. " +
    "What differs is the CONSEQUENCE: the same force divided by a tiny mass is an enormous " +
    "acceleration, and divided by two tonnes is almost nothing. The fly is not pushed harder, " +
    "it is just far easier to push.",
  params: [
    { key: "mt", label: "truck", min: 1,  max: 5,   step: 0.5, value: 2,   unit: " t" },
    { key: "mf", label: "fly",   min: 10, max: 500, step: 10,  value: 200, unit: " mg" },
    { key: "u",  label: "speed", min: 5,  max: 30,  step: 1,   value: 20,  unit: " m/s" },
  ],

  setup(_, p) {
    return { xt: 0, vt: p.u, xf: FLY_START, vf: 0, F: 0, touched: false, done: false,
             vt0: p.u, peakF: 0 };
  },

  step(s, dt, p) {
    if (s.done) return;
    // tonnes and milligrams, in kilograms. The stepping lives in the component
    // so it can be held against the exact elastic result in a test.
    const cfg = { mt: p.mt * 1000, mf: p.mf * 1e-6, stiffness: K };
    const h = (dt * SLOW) / 8;
    for (let i = 0; i < 8; i++) {
      s.F = stepContact(s, h, cfg);
      if (s.F > 0) { s.touched = true; s.peakF = Math.max(s.peakF, s.F); }
    }
    if (s.touched && s.xf > REVEAL_AT) { s.done = true; lab.reveal(); }
  },

  draw(ctx, s, p, view) {
    const scale = view.w / (RIGHT - LEFT);
    const X = (x) => (x - LEFT) * scale;
    const road = view.h * 0.80;
    const truckH = view.h * 0.52;
    const mt = p.mt * 1000, mf = p.mf * 1e-6;

    ctx.fillStyle = "#1B1815";
    ctx.fillRect(0, 0, view.w, view.h);

    ctx.strokeStyle = "#4A4239"; ctx.lineWidth = 2;
    seg(ctx, 0, road, view.w, road);

    // truck — a wall of metal arriving from the left, front edge is what matters
    ctx.fillStyle = "#3C4542";
    ctx.fillRect(0, road - truckH, X(s.xt), truckH);
    ctx.fillStyle = "#5C6763";
    ctx.fillRect(X(s.xt) - 7, road - truckH, 7, truckH);
    label(ctx, `truck  ${p.mt} t`, 16, road - truckH + 22, "#C8C0B6");

    // fly
    ctx.fillStyle = "#F2EEE8";
    ctx.beginPath(); ctx.arc(X(s.xf), road - 26, 7, 0, Math.PI * 2); ctx.fill();
    label(ctx, `fly  ${p.mf} mg`, X(s.xf) - 24, road - 44, "#A79E92");

    // the moment itself: two arrows, equal length, opposite directions
    if (s.F > 0) {
      // Two arrows, drawn on separate lines so they read as two forces rather
      // than one double-headed line — and always the same length as each other.
      const len = Math.min(190, 40 + (s.F / Math.max(s.peakF, 1e-9)) * 150);
      const yT = road - truckH * 0.66, yF = yT + 42;
      arrow(ctx, X(s.xt), yT, X(s.xt) - len, yT, "#E8703A");
      label(ctx, "force on the TRUCK", X(s.xt) - len, yT - 11, "#E8703A");
      arrow(ctx, X(s.xf), yF, X(s.xf) + len, yF, "#E8703A");
      label(ctx, "force on the FLY", X(s.xf) + 8, yF - 11, "#E8703A");
      label(ctx, "same length, every frame", 16, view.h - 34, "#E8703A");
    }

    const rows = [
      [`force on truck`, `${fmt(s.F)} N`, "#F2EEE8"],
      [`force on fly`,   `${fmt(s.F)} N`, "#F2EEE8"],
      [`truck speeds up by`, `${fmt(accelerationFrom(s.F, mt))} m/s²`, "#6E665C"],
      [`fly speeds up by`,   `${fmt(accelerationFrom(s.F, mf))} m/s²`, "#D65442"],
    ];
    rows.forEach(([k, v, c], i) => {
      label(ctx, k.padEnd(22) + v, 16, 32 + i * 19, c);
    });
    label(ctx, `truck  ${s.vt.toFixed(4)} m/s      fly  ${s.vf.toFixed(2)} m/s`,
          16, view.h - 12, "#A79E92");
  },
});

function fmt(x) {
  if (!isFinite(x) || x === 0) return "0";
  const a = Math.abs(x);
  return a >= 1e5 || a < 0.01 ? x.toExponential(2) : x.toFixed(2);
}
function seg(ctx, x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function arrow(ctx, x1, y1, x2, y2, colour) {
  ctx.strokeStyle = colour; ctx.fillStyle = colour; ctx.lineWidth = 3;
  seg(ctx, x1, y1, x2, y2);
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 10 * Math.cos(a - 0.45), y2 - 10 * Math.sin(a - 0.45));
  ctx.lineTo(x2 - 10 * Math.cos(a + 0.45), y2 - 10 * Math.sin(a + 0.45));
  ctx.fill();
}
function label(ctx, text, x, y, colour) {
  ctx.fillStyle = colour;
  ctx.font = '12px "Spline Sans Mono", ui-monospace, monospace';
  ctx.fillText(text, x, y);
}
</script>

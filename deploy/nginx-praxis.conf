# Static hosting for the Praxis lab.
#
# The one thing that must not be left to defaults: nginx does not know the
# .mjs extension, and would serve every module as application/octet-stream,
# which a browser refuses to import. Every scenario would fail to load.
types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
    image/svg+xml           svg;
}

# Say the encoding. GitHub Pages sends `text/html; charset=utf-8`; this server
# sent a bare `text/html`, so the same bundle rendered correctly there and as
# mojibake here the moment a page carried an em-dash in its title (P-85). The
# built pages now declare it themselves too — this makes the header agree.
charset utf-8;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Small site, deployed often, used for testing — never serve a stale build.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
